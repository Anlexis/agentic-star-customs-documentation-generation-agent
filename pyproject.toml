[project]
name = "log-c2-011"
version = "0.1.0"
description = "CustomsDocumentationGeneratorAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/examples/"]
# Temporary framework-wheel compatibility exception: the published
# agenticstar-agentcore wheel ships no py.typed marker, so framework.* /
# shared.* imports are Any — which makes every required framework subclass an
# [import-untyped] / "subclass of Any" error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same root cause as disallow_subclassing_any above: AgentState comes from the
# untyped framework wheel, so mypy cannot see that State's base IS a TypedDict
# and rejects the NotRequired[] markers the framework itself uses on the same
# class. The markers are correct at runtime (these fields are genuinely absent
# at the start of a run), so the error code is disabled for this module only.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
